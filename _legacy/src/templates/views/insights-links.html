<sc-if value="{{ showInsLinks }}" hint-placeholder-val="{{ false }}"><section data-screen-label="Insights · Diagnose and Build" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto"><p style="margin:0 0 24px; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">Put this into practice</p><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap:16px"><div data-reveal="" style="border-radius:22px; padding:clamp(22px,2.6vw,32px); background:linear-gradient(140deg, rgba(var(--glass),.075), rgba(var(--glass),.02) 50%, rgba(var(--glass),.04)); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid rgba(var(--ink-rgb),.12); box-shadow:inset 0 1px 0 rgba(var(--glass),.16); display:flex; flex-direction:column; gap:16px"><div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap"><span style="font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(22px,2vw,28px); letter-spacing:-0.02em; color:var(--ink)">Diagnose</span><span style="font-size:14px; color:var(--muted)">Find the gate that fails first</span></div><div style="display:flex; flex-wrap:wrap; gap:8px"><sc-for list="{{ insDiag }}" as="dg" hint-placeholder-count="6"><a href="{{ dg.href }}" style="display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 16px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.16); background:rgba(var(--glass),.03); font-size:14px; color:var(--ink); transition:border-color .25s, background .25s" style-hover="border-color:var(--acc); background:rgba(var(--acc-rgb),.1); color:var(--ink)">{{ dg.l }}<span aria-hidden="true" style="color:var(--acc)">→</span></a></sc-for></div></div><div data-reveal="" style="border-radius:22px; padding:clamp(22px,2.6vw,32px); background:linear-gradient(140deg, rgba(var(--glass),.075), rgba(var(--glass),.02) 50%, rgba(var(--glass),.04)); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid rgba(var(--ink-rgb),.12); box-shadow:inset 0 1px 0 rgba(var(--glass),.16); display:flex; flex-direction:column; gap:16px"><div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap"><span style="font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(22px,2vw,28px); letter-spacing:-0.02em; color:var(--ink)">Build</span><span style="font-size:14px; color:var(--muted)">Fix it in a sprint or fixed-price job</span></div><div style="display:flex; flex-wrap:wrap; gap:8px"><sc-for list="{{ insBuild }}" as="bd" hint-placeholder-count="6"><a href="{{ bd.href }}" style="display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 16px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.16); background:rgba(var(--glass),.03); font-size:14px; color:var(--ink); transition:border-color .25s, background .25s" style-hover="border-color:var(--acc); background:rgba(var(--acc-rgb),.1); color:var(--ink)">{{ bd.l }}<span aria-hidden="true" style="color:var(--acc)">→</span></a></sc-for></div></div></div></section></sc-if>
