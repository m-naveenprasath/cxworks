<sc-if value="{{ isInsights }}" hint-placeholder-val="{{ false }}">
  <section data-screen-label="Insights" style="padding:clamp(140px,16vw,200px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto">
    <p style="margin:0 0 28px; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); animation:cxFade .9s cubic-bezier(.16,1,.3,1) both"><a href="#/" style="color:var(--muted)" style-hover="color:var(--acc)">Home</a> / <span style="color:var(--acc)">Insights</span></p>
    <h1 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(44px,7.2vw,116px); letter-spacing:-0.05em; line-height:.98; max-width:15ch; animation:cxFade 1s .1s cubic-bezier(.16,1,.3,1) both">eCommerce &amp; Digital CX Insights.</h1>
    <div style="margin-top:clamp(36px,4vw,56px); display:flex; flex-wrap:wrap; gap:8px; animation:cxFade 1s .2s cubic-bezier(.16,1,.3,1) both">
      <sc-for list="{{ insCats }}" as="t" hint-placeholder-count="6"><button sc-camel-on-click="{{ t.pick }}" style="min-height:42px; padding:0 18px; border-radius:999px; border:1px solid {{ t.border }}; background:{{ t.bg }}; color:{{ t.c }}; font-family:inherit; font-size:14px; white-space:nowrap; cursor:pointer; transition:all .4s cubic-bezier(.16,1,.3,1)">{{ t.name }}</button></sc-for>
    </div>
    <div style="margin-top:28px; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap:clamp(16px,2vw,28px)">
      <sc-for list="{{ insList }}" as="a" hint-placeholder-count="6">
        <a href="{{ a.href }}" style="display:flex; flex-direction:column; border-radius:20px; overflow:hidden; border:1px solid rgba(var(--ink-rgb),.12); background:rgba(var(--ink-rgb),.03); color:var(--ink); animation:cxFade .5s {{ a.d }} cubic-bezier(.16,1,.3,1) both; transition:transform .5s cubic-bezier(.16,1,.3,1), border-color .4s" style-hover="transform:translateY(-6px); border-color:rgba(var(--acc-rgb),.5); color:var(--ink)">
          <span aria-hidden="true" data-mthumb="" style="position:relative; display:block; aspect-ratio:1/1; overflow:hidden; background:radial-gradient(120% 90% at {{ a.gx }} {{ a.gy }}, rgba(var(--acc-rgb),.32), rgba(var(--acc-rgb),.06) 45%, var(--surface) 75%)">
            <span style="position:absolute; left:50%; top:50%; width:{{ a.r1 }}; height:{{ a.r1 }}; margin-left:{{ a.m1 }}; margin-top:{{ a.m1 }}; border-radius:50%; border:1px dashed rgba(var(--acc-rgb),.45); animation:cxSpin {{ a.sp }} linear infinite"><span style="position:absolute; top:-5px; left:50%; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:var(--acc); box-shadow:none"></span></span>
            <span style="position:absolute; left:50%; top:50%; width:{{ a.r2 }}; height:{{ a.r2 }}; margin-left:{{ a.m2 }}; margin-top:{{ a.m2 }}; border-radius:50%; border:1px solid rgba(var(--ink-rgb),.16); animation:cxSpin {{ a.sp2 }} linear infinite reverse"><span style="position:absolute; bottom:-4px; left:50%; width:8px; height:8px; margin-left:-4px; border-radius:50%; background:var(--ink)"></span></span>
            <span style="position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:18px; background:rgba(var(--bg-rgb),.55); border:1px solid rgba(var(--acc-rgb),.5); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:grid; place-items:center; font-family:'Montserrat',sans-serif; font-weight:600; font-size:20px; color:var(--acc); animation:cxBob 5s ease-in-out infinite">{{ a.mono }}</span>
            <span style="position:absolute; left:16px; top:16px; padding:6px 12px; white-space:nowrap; border-radius:999px; background:rgba(var(--bg-rgb),.6); border:1px solid rgba(var(--ink-rgb),.14); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--acc)">{{ a.cat }}</span>
          </span>
          <span style="display:flex; flex-direction:column; gap:10px; padding:clamp(18px,2vw,24px); flex:1">
            <span style="display:flex; flex-wrap:wrap; align-items:center; gap:6px"><span style="display:inline-flex; align-items:center; height:26px; padding:0 10px; border-radius:999px; font-family:'Montserrat',sans-serif; font-size:11.5px; letter-spacing:.04em; white-space:nowrap; background:rgba(var(--acc-rgb),.14); color:var(--acc); text-transform:uppercase">{{ a.cat }}</span><span style="display:inline-flex; align-items:center; height:26px; padding:0 10px; border-radius:999px; font-family:'Montserrat',sans-serif; font-size:11.5px; letter-spacing:.04em; white-space:nowrap; border:1px solid rgba(var(--ink-rgb),.14); color:var(--ink3)">{{ a.date }}</span><span style="display:inline-flex; align-items:center; height:26px; padding:0 10px; border-radius:999px; font-family:'Montserrat',sans-serif; font-size:11.5px; letter-spacing:.04em; white-space:nowrap; border:1px solid rgba(var(--ink-rgb),.14); color:var(--ink3)">{{ a.read }} read</span></span>
            <span style="font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(19px,1.6vw,22px); letter-spacing:-0.02em; line-height:1.2; text-wrap:pretty">{{ a.t }}</span>
            <span style="font-size:14.5px; line-height:1.55; color:var(--muted); text-wrap:pretty">{{ a.ex }}</span>
            <span style="margin-top:auto; display:inline-flex; align-items:center; justify-content:center; gap:8px; align-self:flex-start; height:44px; padding:0 22px; border-radius:999px; background:var(--acc); color:var(--on-acc); font-family:'Montserrat',sans-serif; font-size:14px; font-weight:600; line-height:1; white-space:nowrap; box-shadow:0 10px 24px -12px rgba(var(--acc-rgb),.7)">Read now <span aria-hidden="true">→</span></span>
          </span>
        </a>
      </sc-for>
    </div><sc-if value="{{ insPager }}" hint-placeholder-val="{{ true }}"><nav aria-label="Insights pages" style="margin-top:clamp(32px,4vw,48px); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px"><span style="font-size:14px; color:var(--muted)">{{ insCount }}</span><div style="display:flex; flex-wrap:wrap; gap:8px"><button sc-camel-on-click="{{ insPrev }}" aria-label="Previous page" style="min-width:44px; height:44px; padding:0 14px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.16); font-family:'Montserrat',sans-serif; font-size:14.5px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; background:transparent; color:var(--ink); opacity:{{ insPrevOp }}">←</button><sc-for list="{{ insPages }}" as="pg" hint-placeholder-count="5"><button sc-camel-on-click="{{ pg.go }}" aria-current="{{ pg.cur }}" style="min-width:44px; height:44px; padding:0 14px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.16); font-family:'Montserrat',sans-serif; font-size:14.5px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; background:{{ pg.bg }}; color:{{ pg.c }}">{{ pg.n }}</button></sc-for><button sc-camel-on-click="{{ insNext }}" aria-label="Next page" style="min-width:44px; height:44px; padding:0 14px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.16); font-family:'Montserrat',sans-serif; font-size:14.5px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; background:transparent; color:var(--ink); opacity:{{ insNextOp }}">→</button></div></nav></sc-if>
  </section>
</sc-if>
