<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}"><div role="dialog" aria-modal="true" aria-label="Menu" data-mmenu="" style="position:fixed; inset:0; z-index:150; background:radial-gradient(70% 40% at 85% 0%, rgba(var(--acc-rgb),.18), transparent 70%), radial-gradient(60% 40% at 0% 60%, rgba(40,90,180,.12), transparent 70%), rgba(12,13,15,.5); backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(170%); display:flex; flex-direction:column; animation:cxFade .25s both">
<div style="display:flex; justify-content:space-between; align-items:center; padding:13px 13px 13px 22px; border-bottom:1px solid rgba(var(--ink-rgb),.1)"><img data-logo="" src="assets/images/cxworks-logo.svg" alt="CXWorks" style="height:18px; width:auto"><button sc-camel-on-click="{{ closeMenu }}" aria-label="Close menu" style="width:44px; height:44px; border-radius:50%; border:1px solid rgba(var(--ink-rgb),.2); background:rgba(var(--glass),.06); color:var(--ink); font-size:16px; cursor:pointer">✕</button></div>
<div style="flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 22px 24px; animation:cxSheet .35s cubic-bezier(.16,1,.3,1) both">
<div style="display:flex; flex-direction:column"><sc-for list="{{ mGroups }}" as="g" hint-placeholder-count="5"><div style="border-bottom:1px solid rgba(var(--ink-rgb),.1)"><button sc-camel-on-click="{{ g.toggle }}" aria-expanded="{{ g.open }}" style="width:100%; min-height:64px; display:flex; justify-content:space-between; align-items:center; gap:12px; background:none; border:0; padding:12px 0; color:{{ g.tc }}; text-align:left; cursor:pointer; font-family:inherit"><span style="display:flex; align-items:baseline; gap:14px"><span style="font-family:'Montserrat',sans-serif; font-size:12px; color:var(--muted2); min-width:20px">{{ g.num }}</span><span style="font-family:'Montserrat',sans-serif; font-weight:500; font-size:24px; letter-spacing:-0.02em">{{ g.t }}</span></span><span aria-hidden="true" style="flex:0 0 32px; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:{{ g.chipBg }}; color:{{ g.chipC }}; transform:{{ g.rot }}; transition:transform .3s, background .3s; font-size:13px">▾</span></button><sc-if value="{{ g.open }}" hint-placeholder-val="{{ false }}"><div style="display:flex; flex-direction:column; padding:4px 0 16px; border-top:1px solid rgba(var(--ink-rgb),.08); animation:cxSheet .3s both"><sc-for list="{{ g.items }}" as="m" hint-placeholder-count="5"><a href="{{ m.href }}" target="{{ m.target }}" sc-camel-on-click="{{ closeMenu }}" style="display:grid; grid-template-columns:36px minmax(0,1fr) 32px; align-items:center; gap:12px; min-height:54px; color:var(--ink)" style-hover="color:var(--acc)"><span style="font-family:'Montserrat',sans-serif; font-size:12.5px; color:var(--acc)">{{ m.n }}</span><span style="font-size:16px; line-height:1.3">{{ m.l }}</span><span aria-hidden="true" style="width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--acc); color:var(--on-acc); font-size:14px; box-shadow:0 6px 18px -6px rgba(var(--acc-rgb),.7)">→</span></a></sc-for><sc-if value="{{ g.hasAll }}" hint-placeholder-val="{{ false }}"><a href="{{ g.all.href }}" sc-camel-on-click="{{ closeMenu }}" style="margin-top:12px; display:flex; align-items:center; justify-content:center; min-height:52px; border-radius:999px; border:1px solid rgba(var(--acc-rgb),.45); font-family:'Montserrat',sans-serif; font-weight:600; font-size:15px; color:var(--acc)" style-hover="background:rgba(var(--acc-rgb),.1); color:var(--acc)">{{ g.all.l }} →</a></sc-if></div></sc-if></div></sc-for></div>
<div style="display:flex; flex-direction:column"><sc-for list="{{ mLinks }}" as="m" hint-placeholder-count="3"><a href="{{ m.href }}" target="{{ m.target }}" sc-camel-on-click="{{ closeMenu }}" style="display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:64px; padding:12px 0; border-bottom:1px solid rgba(var(--ink-rgb),.1); color:var(--ink)" style-hover="color:var(--acc)"><span style="display:flex; align-items:baseline; gap:14px"><span style="font-family:'Montserrat',sans-serif; font-size:12px; color:var(--muted2); min-width:20px">{{ m.num }}</span><span style="font-family:'Montserrat',sans-serif; font-weight:500; font-size:24px; letter-spacing:-0.02em">{{ m.l }}</span></span><span aria-hidden="true" style="font-size:16px; color:var(--acc)">{{ m.arr }}</span></a></sc-for></div>
</div>
<div style="padding:14px 22px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid rgba(var(--ink-rgb),.1); display:flex; flex-direction:column; gap:8px"><a href="#/free-ai-scan" sc-camel-on-click="{{ closeMenu }}" style="display:flex; align-items:center; justify-content:center; gap:10px; min-height:54px; border-radius:999px; background:var(--acc); color:var(--on-acc); font-family:'Montserrat',sans-serif; font-weight:600; font-size:16px" style-hover="background:var(--acc2); color:var(--on-acc)">Get your free AI scan →</a><a href="mailto:info@cxworks.com" style="text-align:center; font-size:13.5px; color:var(--muted); min-height:32px; display:flex; align-items:center; justify-content:center" style-hover="color:var(--ink)">info@cxworks.com</a></div>
</div></sc-if>
