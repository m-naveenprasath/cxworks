<header data-mhdr="" style="position:fixed; top:12px; left:12px; right:12px; max-width:1280px; margin:0 auto; z-index:100; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 6px 6px 20px; border-radius:999px; background:linear-gradient(140deg, rgba(var(--glass),.12), rgba(var(--glass),.03) 50%, rgba(var(--glass),.07)); backdrop-filter:blur(32px) saturate(200%); -webkit-backdrop-filter:blur(32px) saturate(200%); border:1px solid rgba(var(--glass),.16); box-shadow:inset 0 1px 0 rgba(var(--glass),.32), inset 0 -1px 0 rgba(var(--glass),.06), 0 16px 40px -16px rgba(var(--shade),.85)" sc-camel-on-mouse-leave="{{ ddLeave }}">
<a href="#/" aria-label="CXWorks home" style="display:flex; align-items:center; min-height:44px"><img data-logo="" src="assets/images/cxworks-logo.svg" alt="CXWorks" style="height:24px; width:auto; display:block"></a>
<sc-if value="{{ showFull }}" hint-placeholder-val="{{ true }}">
<nav aria-label="Main" style="display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(var(--shade),.22); box-shadow: inset 0 1px 2px rgba(var(--shade),.35); width: max-content; max-width: 100%; height: 42px; box-sizing: border-box">
<div sc-camel-on-mouse-enter="{{ ddDiagEnter }}" style="position:relative"><button sc-camel-on-click="{{ ddDiagToggle }}" aria-expanded="{{ ddDiagOpen }}" style="display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 clamp(9px,1vw,14px); border-radius:999px; font-size:14px; background:transparent; border:0; cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .3s; color:{{ nav.diagnose }}; background:{{ ddDiagBg }}">Diagnose<span aria-hidden="true" style="font-size:10px; transform:{{ ddDiagRot }}; transition:transform .3s">▾</span></button><sc-if value="{{ ddDiagOpen }}" hint-placeholder-val="{{ false }}"><div style="position:absolute; top:100%; left:0; padding-top:12px; z-index:5"><div style="width:max-content; min-width:300px; max-width:calc(100vw - 48px); padding:8px; border-radius:22px; background:var(--surface); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(var(--ink-rgb),.12); box-shadow:0 30px 60px -20px rgba(var(--shade),.9); display:flex; flex-direction:column; animation:cxFade .3s cubic-bezier(.16,1,.3,1)"><sc-for list="{{ megaDiag }}" as="m" hint-placeholder-count="5"><a href="{{ m.href }}" style="display:grid; grid-template-columns:30px auto 16px; gap:14px; align-items:center; min-height:44px; padding:8px 14px; border-radius:14px; color:var(--ink); font-size:14.5px; transition:background .25s" style-hover="background:rgba(var(--acc-rgb),.1); color:var(--ink)"><span style="font-family:'Montserrat',sans-serif; font-size:12px; color:var(--acc)">{{ m.n }}</span><span style="white-space:nowrap">{{ m.l }}</span><span aria-hidden="true" style="color:var(--acc)">→</span></a></sc-for></div></div></sc-if></div>
<div sc-camel-on-mouse-enter="{{ ddBuildEnter }}" style="position:relative"><button sc-camel-on-click="{{ ddBuildToggle }}" aria-expanded="{{ ddBuildOpen }}" style="display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 clamp(9px,1vw,14px); border-radius:999px; font-size:14px; background:transparent; border:0; cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .3s; color:{{ nav.build }}; background:{{ ddBuildBg }}">Build<span aria-hidden="true" style="font-size:10px; transform:{{ ddBuildRot }}; transition:transform .3s">▾</span></button><sc-if value="{{ ddBuildOpen }}" hint-placeholder-val="{{ false }}"><div style="position:absolute; top:100%; left:0; padding-top:12px; z-index:5"><div style="width:max-content; min-width:300px; max-width:calc(100vw - 48px); padding:8px; border-radius:22px; background:var(--surface); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(var(--ink-rgb),.12); box-shadow:0 30px 60px -20px rgba(var(--shade),.9); display:flex; flex-direction:column; animation:cxFade .3s cubic-bezier(.16,1,.3,1)"><sc-for list="{{ megaBuild }}" as="m" hint-placeholder-count="5"><a href="{{ m.href }}" style="display:grid; grid-template-columns:30px auto 16px; gap:14px; align-items:center; min-height:44px; padding:8px 14px; border-radius:14px; color:var(--ink); font-size:14.5px; transition:background .25s" style-hover="background:rgba(var(--acc-rgb),.1); color:var(--ink)"><span style="font-family:'Montserrat',sans-serif; font-size:12px; color:var(--acc)">{{ m.n }}</span><span style="white-space:nowrap">{{ m.l }}</span><span aria-hidden="true" style="color:var(--acc)">→</span></a></sc-for></div></div></sc-if></div>
<div sc-camel-on-mouse-enter="{{ ddRunEnter }}" style="position:relative"><button sc-camel-on-click="{{ ddRunToggle }}" aria-expanded="{{ ddRunOpen }}" style="display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 clamp(9px,1vw,14px); border-radius:999px; font-size:14px; background:transparent; border:0; cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .3s; color:{{ nav.run }}; background:{{ ddRunBg }}">Run<span aria-hidden="true" style="font-size:10px; transform:{{ ddRunRot }}; transition:transform .3s">▾</span></button><sc-if value="{{ ddRunOpen }}" hint-placeholder-val="{{ false }}"><div style="position:absolute; top:100%; left:0; padding-top:12px; z-index:5"><div style="width:max-content; min-width:300px; max-width:calc(100vw - 48px); padding:8px; border-radius:22px; background:var(--surface); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(var(--ink-rgb),.12); box-shadow:0 30px 60px -20px rgba(var(--shade),.9); display:flex; flex-direction:column; animation:cxFade .3s cubic-bezier(.16,1,.3,1)"><sc-for list="{{ megaRun }}" as="m" hint-placeholder-count="5"><a href="{{ m.href }}" style="display:grid; grid-template-columns:30px auto 16px; gap:14px; align-items:center; min-height:44px; padding:8px 14px; border-radius:14px; color:var(--ink); font-size:14.5px; transition:background .25s" style-hover="background:rgba(var(--acc-rgb),.1); color:var(--ink)"><span style="font-family:'Montserrat',sans-serif; font-size:12px; color:var(--acc)">{{ m.n }}</span><span style="white-space:nowrap">{{ m.l }}</span><span aria-hidden="true" style="color:var(--acc)">→</span></a></sc-for></div></div></sc-if></div>
<a href="#/nine-gates" sc-camel-on-mouse-enter="{{ ddLeave }}" style="display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 clamp(9px,1vw,14px); border-radius:999px; font-size:14px; background:transparent; border:0; cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .3s; color:{{ nav.ninegates }}" style-hover="color:var(--ink)">Nine Gates</a>

<a href="#/insights" sc-camel-on-mouse-enter="{{ ddLeave }}" style="display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 clamp(9px,1vw,14px); border-radius:999px; font-size:14px; background:transparent; border:0; cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .3s; color:{{ nav.insights }}" style-hover="color:var(--ink)">Insights</a>
<a href="#/about" sc-camel-on-mouse-enter="{{ ddLeave }}" style="display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 clamp(9px,1vw,14px); border-radius:999px; font-size:14px; background:transparent; border:0; cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .3s; color:{{ nav.about }}" style-hover="color:var(--ink)">Contact us</a>
<sc-if value="{{ true }}" hint-placeholder-val="{{ true }}"><a href="{{ productsUrl }}" target="_blank" rel="noopener" sc-camel-on-mouse-enter="{{ ddLeave }}" style="display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 clamp(9px,1vw,14px); border-radius:999px; font-size:14px; background:transparent; border:0; cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .3s; color:var(--ink3)" style-hover="color:var(--ink)">Products <span aria-hidden="true" style="font-size:13px">↗</span></a></sc-if>
</nav>
<a href="#/free-ai-scan" data-magnet="" style="display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:46px; padding:0 22px; border-radius:999px; background:var(--acc); color:var(--on-acc); font-family:'Montserrat',sans-serif; font-weight:600; font-size:14.5px; white-space:nowrap; border:0; cursor:pointer; transition:background .3s" style-hover="background:var(--acc2); color:var(--on-acc)">Free AI scan</a>
</sc-if>
<sc-if value="{{ showBurger }}" hint-placeholder-val="{{ false }}"><div style="display:flex; align-items:center; gap:6px"><a data-mcta="" href="#/free-ai-scan" style="display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:46px; padding:0 22px; border-radius:999px; background:var(--acc); color:var(--on-acc); font-family:'Montserrat',sans-serif; font-weight:600; font-size:14.5px; white-space:nowrap; border:0; cursor:pointer; transition:background .3s; min-height:44px; padding:0 16px; font-size:14px" style-hover="background:var(--acc2); color:var(--on-acc)">Free AI scan</a><button sc-camel-on-click="{{ openMenu }}" aria-label="Open menu" aria-expanded="{{ menuOpen }}" style="width:44px; height:44px; flex:0 0 44px; border-radius:50%; border:1px solid rgba(var(--ink-rgb),.2); background:rgba(var(--glass),.06); color:var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:0"><span style="display:block; width:16px; height:1.5px; border-radius:2px; background:currentColor"></span><span style="display:block; width:16px; height:1.5px; border-radius:2px; background:currentColor"></span><span style="display:block; width:10px; height:1.5px; border-radius:2px; background:currentColor; margin-left:6px"></span></button></div></sc-if>
<sc-if value="{{ isFocus }}" hint-placeholder-val="{{ false }}"><a href="#/" style="display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.2); color:var(--ink3); font-size:14.5px" style-hover="color:var(--ink); border-color:var(--acc)">← Back to site</a></sc-if>


</header>
