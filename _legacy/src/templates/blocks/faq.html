<sc-if value="{{ b.is_faq }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap:clamp(24px,4vw,64px)"><div><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></sc-if><sc-if value="{{ b.hasP }}" hint-placeholder-val="{{ false }}"><p style="margin:0; font-size:clamp(16px,1.3vw,18px); line-height:1.6; color:var(--ink3); max-width:62ch; text-wrap:pretty">{{ b.p }}</p></sc-if></div></div><div style="border-top:1px solid rgba(var(--ink-rgb),.12); grid-column:1 / -1"><sc-for list="{{ faqItems }}" as="q" hint-placeholder-count="5"><div style="border-bottom:1px solid rgba(var(--ink-rgb),.12)"><button sc-camel-on-click="{{ q.toggle }}" aria-expanded="{{ q.open }}" style="width:100%; min-height:64px; padding:18px 0; display:flex; justify-content:space-between; align-items:center; gap:16px; background:none; border:0; color:{{ q.c }}; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(17px,1.4vw,19px); text-align:left; cursor:pointer">{{ q.q }}<span aria-hidden="true" style="flex:none; width:36px; height:36px; border-radius:50%; border:1px solid {{ q.ring }}; display:grid; place-items:center; color:var(--acc); transform:{{ q.rot }}; transition:transform .4s">+</span></button><sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}"><p style="margin:0; font-size:15.5px; line-height:1.55; color:var(--muted); text-wrap:pretty; padding:0 48px 22px 0; font-size:16px; color:var(--ink3)">{{ q.a }}</p></sc-if></div></sc-for></div></div></section></sc-if>
