<sc-if value="{{ b.is_seo }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div style="display:flex; flex-direction:column; gap:24px; max-width:880px"><div style="display:flex; flex-direction:column; gap:14px"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(28px,3.2vw,44px); letter-spacing:-0.035em; line-height:1.1; text-wrap:balance">{{ b.h }}</h2></div><div style="display:flex; flex-direction:column; gap:16px"><sc-for list="{{ b.paras }}" as="pa" hint-placeholder-count="4"><p data-reveal="" style="margin:0; font-size:clamp(16px,1.2vw,17.5px); line-height:1.75; color:var(--ink3); text-wrap:pretty">{{ pa }}</p></sc-for></div></div></section></sc-if>
