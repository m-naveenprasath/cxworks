<sc-if value="{{ b.is_reviews }}" hint-placeholder-val="{{ false }}"><section data-reviews="" data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto"><div style="display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 32px; margin-bottom:clamp(28px,3.4vw,44px)"><div style="display:flex; flex-direction:column; gap:14px"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">In their words</p><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(30px,4vw,54px); letter-spacing:-0.04em; line-height:1.05; text-wrap:balance">What clients say about <span style="color:var(--acc); font-style:italic; font-weight:400">working with us.</span></h2></div></div><div sc-camel-on-mouse-enter="{{ b.rvEnter }}" sc-camel-on-mouse-leave="{{ b.rvLeave }}" style="overflow:hidden"><div style="display:flex; gap:16px"><sc-for list="{{ b.revs }}" as="r" hint-placeholder-count="3"><figure style="margin:0; flex:0 0 {{ r.basis }}; min-width:0; box-sizing:border-box; transform:{{ r.tx }}; transition:transform .8s cubic-bezier(.16,1,.3,1), border-color .35s; border-radius:22px; border:1px solid rgba(var(--ink-rgb),.12); background:linear-gradient(140deg, rgba(var(--glass),.07), rgba(var(--glass),.02) 50%, rgba(var(--glass),.04)); box-shadow:inset 0 1px 0 rgba(var(--glass),.12); padding:clamp(24px,2.6vw,36px); display:flex; flex-direction:column; gap:22px" style-hover="border-color:rgba(var(--acc-rgb),.5)"><span style="display:flex; flex-direction:column-reverse; align-items:flex-start; gap:18px"><span aria-hidden="true" style="font-family:'Montserrat',sans-serif; font-weight:600; font-style:italic; font-size:52px; line-height:.6; color:var(--acc); height:26px">“</span><a href="{{ r.href }}" style="padding:6px 12px; border-radius:999px; background:rgba(var(--acc-rgb),.12); border:1px solid rgba(var(--acc-rgb),.3); color:var(--acc); font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.04em; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; transition:background .25s" style-hover="background:rgba(var(--acc-rgb),.22); color:var(--acc)">{{ r.sol }}</a></span><blockquote style="margin:0; flex:1; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(17px,1.35vw,20px); letter-spacing:-0.015em; line-height:1.45; color:var(--ink); text-wrap:pretty">{{ r.q }}</blockquote><figcaption style="display:flex; align-items:center; gap:14px; padding-top:18px; border-top:1px solid rgba(var(--ink-rgb),.1)"><span role="img" aria-label="{{ r.country }}" title="{{ r.country }}" style="flex:none; width:40px; height:28px; border-radius:6px; background-image:{{ r.flag }}; background-size:cover; background-position:center; box-shadow:0 0 0 1px rgba(var(--ink-rgb),.15)"></span><span style="display:flex; flex-direction:column; gap:3px; min-width:0"><span style="font-family:'Montserrat',sans-serif; font-weight:600; font-size:15px; color:var(--ink)">{{ r.name }}</span><span style="font-size:13.5px; line-height:1.4; color:var(--muted)">{{ r.role }}, {{ r.co }}</span></span></figcaption></figure></sc-for></div></div><div style="margin-top:24px; display:flex; justify-content:center; align-items:center; gap:18px"><button type="button" aria-label="Previous testimonial" sc-camel-on-click="{{ b.rvPrev }}" style="width:46px; height:46px; border-radius:50%; border:0; background:var(--acc); color:var(--bg); display:grid; place-items:center; cursor:pointer; transition:transform .25s, filter .25s" style-hover="transform:translateY(-2px); filter:brightness(1.1)"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button><div style="display:flex; gap:6px"><sc-for list="{{ b.rvDots }}" as="d" hint-placeholder-count="6"><button type="button" aria-label="Go to testimonial" sc-camel-on-click="{{ d.go }}" style="width:{{ d.w }}; height:8px; padding:0; border:0; border-radius:999px; background:{{ d.bg }}; cursor:pointer; transition:width .4s, background .4s"></button></sc-for></div><button type="button" aria-label="Next testimonial" sc-camel-on-click="{{ b.rvNext }}" style="width:46px; height:46px; border-radius:50%; border:0; background:var(--acc); color:var(--bg); display:grid; place-items:center; cursor:pointer; transition:transform .25s, filter .25s" style-hover="transform:translateY(-2px); filter:brightness(1.1)"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button></div></section></sc-if>
