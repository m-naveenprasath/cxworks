<sc-if value="{{ b.is_checklist }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></sc-if><sc-if value="{{ b.hasP }}" hint-placeholder-val="{{ false }}"><p style="margin:0; font-size:clamp(16px,1.3vw,18px); line-height:1.6; color:var(--ink3); max-width:62ch; text-wrap:pretty">{{ b.p }}</p></sc-if></div><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap:16px"><sc-for list="{{ b.groups }}" as="g" hint-placeholder-count="3"><div data-reveal="" style="background:linear-gradient(140deg, rgba(var(--glass),.075), rgba(var(--glass),.02) 50%, rgba(var(--glass),.04)); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid rgba(var(--glass),.12); box-shadow:inset 0 1px 0 rgba(var(--glass),.16); border-radius:22px; padding:clamp(20px,2.4vw,28px); display:flex; flex-direction:column; gap:4px"><span style="font-family:'Montserrat',sans-serif; font-style:italic; font-size:26px; color:var(--acc); margin-bottom:8px">{{ g.gate }}</span><sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3"><div style="display:grid; grid-template-columns:24px minmax(0,1fr); gap:10px; padding:12px 0; border-top:1px solid rgba(var(--ink-rgb),.1)"><span aria-hidden="true" style="color:var(--acc); flex:none; display:inline-flex; padding-top:.25em"><svg width="13" height="13" sc-camel-view-box="0 0 24 24" fill="currentColor" style="display:block"><path d="M12 2.5c.7 4.6 3.4 7.3 8 8-4.6.7-7.3 3.4-8 8-.7-4.6-3.4-7.3-8-8 4.6-.7 7.3-3.4 8-8z"></path></svg></span><span style="display:flex; flex-direction:column; gap:3px"><span style="font-family:'Montserrat',sans-serif; font-weight:500; font-size:16px">{{ it.k }}</span><span style="font-size:14.5px; line-height:1.5; color:var(--muted)">{{ it.v }}</span></span></div></sc-for></div></sc-for></div></section></sc-if>
