<sc-if value="{{ b.is_ai }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></sc-if><sc-if value="{{ b.hasP }}" hint-placeholder-val="{{ false }}"><p style="margin:0; font-size:clamp(16px,1.3vw,18px); line-height:1.6; color:var(--ink3); max-width:62ch; text-wrap:pretty">{{ b.p }}</p></sc-if></div><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap:16px"><div data-reveal="" style="background:rgba(var(--acc-rgb),.10); border:1px solid rgba(var(--acc-rgb),.55); border-radius:22px; padding:clamp(22px,2.6vw,32px); display:flex; flex-direction:column; gap:16px; transition:transform .45s cubic-bezier(.16,1,.3,1), border-color .35s, box-shadow .45s, background .35s" style-hover="transform:translateY(-4px); border-color:var(--acc); background:rgba(var(--acc-rgb),.14); box-shadow:0 24px 50px -28px rgba(var(--acc-rgb),.7)"><span style="display:inline-flex; align-items:center; gap:10px; font-family:'Montserrat',sans-serif; font-weight:600; font-size:18px"><span aria-hidden="true" style="width:10px; height:10px; border-radius:50%; background:var(--acc); animation:cxPulse 1.6s ease-in-out infinite"></span>What AI agents watch</span><sc-for list="{{ b.watch }}" as="w" hint-placeholder-count="6"><div style="display:flex; gap:12px; align-items:flex-start; padding:12px 10px 0; margin:0 -10px; border-radius:10px; border-top:1px solid rgba(var(--acc-rgb),.22); font-size:15.5px; color:var(--ink); transition:transform .35s cubic-bezier(.16,1,.3,1), color .3s" style-hover="transform:translateX(6px); color:var(--acc)"><span aria-hidden="true" style="color:var(--acc)">◉</span>{{ w }}</div></sc-for></div><div data-reveal="" style="background:rgba(var(--acc-rgb),.10); border:1px solid rgba(var(--acc-rgb),.55); border-radius:22px; padding:clamp(22px,2.6vw,32px); display:flex; flex-direction:column; gap:16px; transition:transform .45s cubic-bezier(.16,1,.3,1), border-color .35s, box-shadow .45s, background .35s" style-hover="transform:translateY(-4px); border-color:var(--acc); background:rgba(var(--acc-rgb),.14); box-shadow:0 24px 50px -28px rgba(var(--acc-rgb),.7)"><span style="display:inline-flex; align-items:center; gap:10px; font-family:'Montserrat',sans-serif; font-weight:600; font-size:18px"><span aria-hidden="true" style="width:10px; height:10px; border-radius:50%; background:var(--acc); animation:cxPulse 1.6s ease-in-out infinite"></span>What experts decide</span><sc-for list="{{ b.decide }}" as="w" hint-placeholder-count="5"><div style="display:flex; gap:12px; align-items:flex-start; padding:12px 10px 0; margin:0 -10px; border-radius:10px; border-top:1px solid rgba(var(--acc-rgb),.22); font-size:15.5px; color:var(--ink); transition:transform .35s cubic-bezier(.16,1,.3,1), color .3s" style-hover="transform:translateX(6px); color:var(--acc)"><span aria-hidden="true" style="color:var(--acc); flex:none; display:inline-flex; padding-top:.25em"><svg width="13" height="13" sc-camel-view-box="0 0 24 24" fill="currentColor" style="display:block"><path d="M12 2.5c.7 4.6 3.4 7.3 8 8-4.6.7-7.3 3.4-8 8-.7-4.6-3.4-7.3-8-8 4.6-.7 7.3-3.4 8-8z"></path></svg></span>{{ w }}</div></sc-for></div></div></section></sc-if>
