<sc-if value="{{ b.is_routes }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></sc-if></div>
<div style="display:flex; flex-direction:column">
<a href="#/nine-gates" style="display:block; text-align:center; padding:18px 20px; border-radius:18px; border:1px solid rgba(var(--ink-rgb),.18); background:rgba(var(--ink-rgb),.05); font-family:'Montserrat',sans-serif; font-weight:600; font-size:17px; color:var(--ink); text-decoration:none" style-hover="border-color:var(--acc)">Home and Nine Gates hub</a>
<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap:0 16px"><sc-for list="{{ b.stg }}" as="c" hint-placeholder-count="3"><div style="display:flex; flex-direction:column"><div aria-hidden="true" style="width:2px; height:28px; margin:0 auto; background:rgba(var(--ink-rgb),.2)"></div><a href="{{ c.href }}" style="display:flex; flex-direction:column; gap:8px; padding:20px 22px; border-radius:18px; border:1px solid rgba(var(--ink-rgb),.12); background:rgba(var(--glass),.03); text-decoration:none; color:var(--ink); transition:all .3s ease; height:100%; box-sizing:border-box" style-hover="border-color:rgba(var(--acc-rgb),.7); transform:translateY(-3px)"><span style="font-family:'Montserrat',sans-serif; font-weight:600; font-size:19px">{{ c.n }}</span><sc-for list="{{ c.items }}" as="it" hint-placeholder-count="6"><span style="font-size:14.5px; line-height:1.4; color:var(--ink3)">{{ it }}</span></sc-for></a></div></sc-for></div>
<div aria-hidden="true" style="width:2px; height:28px; margin:0 auto; background:rgba(var(--ink-rgb),.2)"></div>
<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap:12px"><sc-for list="{{ b.entry }}" as="e" hint-placeholder-count="4"><a href="{{ e.href }}" style="display:flex; flex-direction:column; gap:4px; align-items:center; text-align:center; padding:18px; border-radius:16px; border:1px solid rgba(var(--ink-rgb),.12); text-decoration:none; color:var(--ink); transition:all .3s ease" style-hover="border-color:rgba(var(--acc-rgb),.7); background:rgba(var(--acc-rgb),.06)"><span style="font-family:'Montserrat',sans-serif; font-weight:600; font-size:16px">{{ e.t }}</span><span style="font-size:13.5px; color:var(--ink3)">{{ e.d }}</span></a></sc-for></div>
<div aria-hidden="true" style="width:2px; height:28px; margin:0 auto; background:rgba(var(--ink-rgb),.2)"></div>
<div style="border:1px dashed rgba(var(--ink-rgb),.22); border-radius:20px; padding:clamp(16px,2vw,24px); display:flex; flex-direction:column; gap:14px"><span style="font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3)">Where every route ends</span><div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px"><sc-for list="{{ b.ends }}" as="e" hint-placeholder-count="3"><a href="{{ e.href }}" style="flex:1 1 180px; display:flex; align-items:center; justify-content:center; gap:8px; min-height:56px; padding:0 18px; border-radius:14px; border:1px solid {{ e.bd }}; background:{{ e.bg }}; color:var(--ink); text-decoration:none; font-family:'Montserrat',sans-serif; font-weight:600; font-size:16px; transition:all .5s ease">{{ e.t }}<span aria-hidden="true" style="color:var(--acc); display:{{ e.arrow }}">→</span></a></sc-for></div></div>
</div></section></sc-if>
