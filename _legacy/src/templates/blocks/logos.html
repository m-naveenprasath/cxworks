<sc-if value="{{ b.is_logos }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative; padding-top:clamp(48px,6vw,80px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); color:var(--muted); margin-bottom:20px">{{ b.eb }}</p><div style="overflow:hidden; padding:clamp(28px,3vw,40px) 0; border-top:1px solid rgba(var(--ink-rgb),.1); border-bottom:1px solid rgba(var(--ink-rgb),.1); -webkit-mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent)" style-hover="--p:paused"><div style="display:flex; width:max-content; animation:cxMarq 32s linear infinite"><sc-for list="{{ partnersLoop }}" as="pt" hint-placeholder-count="12"><img src="{{ pt.src }}" alt="{{ pt.alt }}" aria-hidden="{{ pt.dup }}" loading="lazy" style="height:{{ pt.h }}; width:auto; flex:none; margin-right:clamp(48px,6vw,88px); filter:var(--plogo); opacity:.8; transition:opacity .3s, filter .3s" style-hover="opacity:1; filter:none"></sc-for></div></div></section></sc-if>
