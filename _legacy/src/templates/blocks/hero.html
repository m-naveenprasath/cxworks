<sc-if value="{{ b.is_hero }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(120px,12vw,160px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative">
<sc-if value="{{ b.hasCrumb }}" hint-placeholder-val="{{ false }}"><nav aria-label="Breadcrumb" style="margin:0 0 28px; display:flex; flex-wrap:wrap; gap:6px; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)"><sc-for list="{{ b.crumb }}" as="c" hint-placeholder-count="3"><sc-if value="{{ c.href }}" hint-placeholder-val="{{ true }}"><a href="{{ c.href }}" style="color:var(--muted)" style-hover="color:var(--acc)">{{ c.l }}</a><span aria-hidden="true">/</span></sc-if><sc-if value="{{ c.last }}" hint-placeholder-val="{{ false }}"><span style="color:var(--acc)">{{ c.l }}</span></sc-if></sc-for></nav></sc-if>

<div data-herogrid="{{ b.gridKind }}" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap:clamp(36px,5vw,72px); align-items:start">
<div style="display:flex; flex-direction:column; gap:24px; animation:cxFade 1s cubic-bezier(.16,1,.3,1) both">
<div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.badge }}" hint-placeholder-val="{{ false }}"><span style="padding:5px 12px; border-radius:999px; background:var(--acc); color:var(--on-acc); font-family:'Montserrat',sans-serif; font-size:12px; font-weight:600">{{ b.badge }}</span></sc-if></div>
<h1 id="hero-title" style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:{{ b.h1size }}; letter-spacing:-0.045em; line-height:1.02; max-width:{{ b.h1max }}; text-wrap:balance">{{ b.a }} <span style="color:var(--acc); font-weight:400; font-style:italic">{{ b.b }}</span></h1>
<p data-hero-sub="" style="margin:0; font-size:clamp(16px,1.3vw,18px); line-height:1.6; color:var(--ink3); max-width:62ch; text-wrap:pretty; font-size:clamp(17px,1.5vw,21px); color:var(--ink3)">{{ b.lead }}</p>
<sc-if value="{{ b.hasMeta }}" hint-placeholder-val="{{ false }}"><div style="display:flex; flex-wrap:wrap; gap:8px"><sc-for list="{{ b.meta }}" as="m" hint-placeholder-count="2"><span style="display:inline-flex; align-items:center; min-height:34px; padding:0 14px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.16); font-size:13.5px; color:var(--ink3); color:var(--ink)">{{ m }}</span></sc-for></div></sc-if>
<div style="display:flex; flex-wrap:wrap; gap:12px"><sc-if value="{{ b.btn1 }}" hint-placeholder-val="{{ true }}"><a href="{{ b.btn1.href }}" data-magnet="" style="display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:0 26px; border-radius:999px; background:var(--acc); color:var(--on-acc); font-family:'Montserrat',sans-serif; font-weight:600; font-size:15px; line-height:1.2; text-align:center; border:0; cursor:pointer; transition:background .3s, transform .3s" style-hover="background:var(--acc2); color:var(--on-acc); transform:translateY(-1px)">{{ b.btn1.l }} <span aria-hidden="true">→</span></a></sc-if><sc-if value="{{ b.btn2 }}" hint-placeholder-val="{{ false }}"><a href="{{ b.btn2.href }}" style="display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:0 24px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.32); color:var(--ink); font-family:'Montserrat',sans-serif; font-weight:500; font-size:15px; line-height:1.2; text-align:center; background:transparent; cursor:pointer; transition:border-color .3s, background .3s" style-hover="border-color:var(--acc); background:rgba(var(--acc-rgb),.08); color:var(--ink)">{{ b.btn2.l }}</a></sc-if></div>
<sc-if value="{{ b.small }}" hint-placeholder-val="{{ false }}"><a href="{{ b.small.href }}" style="font-size:15px; color:var(--muted); text-decoration:underline; text-underline-offset:4px; align-self:flex-start; min-height:44px; display:inline-flex; align-items:center" style-hover="color:var(--acc)">{{ b.small.l }}</a></sc-if>
</div>
<sc-if value="{{ b.home }}" hint-placeholder-val="{{ false }}"><div data-ngpanel="" aria-label="AI agents watching the nine gates" style="backdrop-filter:blur(28px) saturate(170%); -webkit-backdrop-filter:blur(28px) saturate(170%); background:radial-gradient(60% 40% at 100% 0%, rgba(var(--acc-rgb),.14), transparent 70%), radial-gradient(55% 35% at 0% 0%, rgba(40,90,180,.12), transparent 70%), radial-gradient(70% 45% at 0% 100%, rgba(var(--acc-rgb),.16), transparent 70%), radial-gradient(55% 45% at 100% 85%, rgba(40,90,180,.16), transparent 70%), linear-gradient(150deg, rgba(var(--glass),.10), rgba(var(--glass),.025) 45%, rgba(var(--glass),.06)), rgba(10,12,14,.55); border:1px solid rgba(var(--glass),.18); box-shadow:inset 0 1px 0 rgba(var(--glass),.22), inset 0 0 0 1px rgba(var(--glass),.03), 0 30px 60px -30px rgba(0,0,0,.8); border-radius:24px; padding:clamp(18px,2.4vw,28px); display:flex; flex-direction:column; gap:14px; animation:cxFade 1.2s .2s cubic-bezier(.16,1,.3,1) both">
<div style="display:flex; justify-content:space-between; align-items:center; gap:12px"><span style="font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)">Nine Gates · Example</span><span style="display:inline-flex; align-items:center; gap:8px; font-family:'Montserrat',sans-serif; font-size:13px; font-weight:500; color:var(--acc)"><span style="width:7px; height:7px; border-radius:50%; background:rgba(var(--acc-rgb),.45)"></span>Example</span></div>
<div sc-camel-on-mouse-leave="{{ heroGatesLeave }}" style="display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px"><sc-for list="{{ heroGates }}" as="g" hint-placeholder-count="9"><div sc-camel-on-mouse-enter="{{ g.enter }}" sc-camel-on-click="{{ g.enter }}" style="cursor:pointer; aspect-ratio:1.25/1; padding:12px; border-radius:14px; border:1px solid {{ g.bd }}; background:{{ g.bg }}; display:flex; flex-direction:column; justify-content:space-between; transition:all .6s cubic-bezier(.16,1,.3,1)"><span style="font-family:'Montserrat',sans-serif; font-size:11.5px; white-space:nowrap; color:{{ g.nc }}">{{ g.n }} · {{ g.stage }}</span><span aria-hidden="true" style="align-self:center; width:clamp(40px,4.4vw,56px); height:clamp(40px,4.4vw,56px); border-radius:14px; display:grid; place-items:center; background:{{ g.ic_bg }}; color:{{ g.ic_c }}; transition:all .6s cubic-bezier(.16,1,.3,1)"><svg width="55%" height="55%" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ g.ic }}"></path></svg></span><span style="font-family:'Montserrat',sans-serif; font-size:clamp(12.5px,1vw,14.5px); font-weight:500; color:{{ g.c }}">{{ g.name }}</span></div></sc-for></div>
<div style="display:flex; gap:12px; align-items:flex-start; padding:18px 20px; border-radius:22px; background:linear-gradient(120deg, rgba(var(--acc-rgb),.16), rgba(40,90,180,.12)); border:1px solid rgba(var(--acc-rgb),.5); box-shadow:inset 0 1px 0 rgba(var(--glass),.12)"><span aria-hidden="true" style="flex:none; width:7px; height:7px; margin-top:8px; border-radius:50%; background:var(--acc)"></span><span style="font-family:'Montserrat',sans-serif; font-size:14.5px; font-weight:500; line-height:1.5; color:var(--ink)">{{ heroSignal }}</span></div>
</div></sc-if>
</div></section></sc-if>
