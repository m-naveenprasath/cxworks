<sc-if value="{{ b.is_catalog }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap:clamp(28px,5vw,72px); align-items:center"><div><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></sc-if><sc-if value="{{ b.hasP }}" hint-placeholder-val="{{ false }}"><p style="margin:0; font-size:clamp(16px,1.3vw,18px); line-height:1.6; color:var(--ink3); max-width:62ch; text-wrap:pretty">{{ b.p }}</p></sc-if></div><div style="display:flex; flex-wrap:wrap; gap:8px"><sc-for list="{{ b.chips }}" as="c" hint-placeholder-count="6"><span style="display:inline-flex; align-items:center; min-height:34px; padding:0 14px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.16); font-size:13.5px; color:var(--ink3)">{{ c }}</span></sc-for></div></div><div data-reveal="" style="background:linear-gradient(140deg, rgba(var(--glass),.075), rgba(var(--glass),.02) 50%, rgba(var(--glass),.04)); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid rgba(var(--glass),.12); box-shadow:inset 0 1px 0 rgba(var(--glass),.16); border-radius:22px; padding:clamp(28px,3.4vw,44px); display:flex; flex-direction:column; gap:10px"><span style="font-family:'Montserrat',sans-serif; font-size:14px; color:var(--muted)">{{ b.big0 }}</span><span aria-hidden="true" style="font-family:'Montserrat',sans-serif; font-size:28px; color:var(--acc)">↓</span><span style="font-family:'Montserrat',sans-serif; font-weight:600; font-size:clamp(40px,5vw,68px); letter-spacing:-0.05em; line-height:1; color:var(--acc)">{{ b.big1 }}</span><div aria-hidden="true" style="margin-top:14px; display:grid; grid-template-columns:repeat(12, 1fr); gap:4px"><sc-for list="{{ pageDots }}" as="d" hint-placeholder-count="36"><span style="aspect-ratio:1; border-radius:3px; background:rgba(var(--acc-rgb),.55)"></span></sc-for></div></div></div></section></sc-if>
