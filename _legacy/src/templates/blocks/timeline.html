<sc-if value="{{ b.is_timeline }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></sc-if><sc-if value="{{ b.hasP }}" hint-placeholder-val="{{ false }}"><p style="margin:0; font-size:clamp(16px,1.3vw,18px); line-height:1.6; color:var(--ink3); max-width:62ch; text-wrap:pretty">{{ b.p }}</p></sc-if></div><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap:16px"><sc-for list="{{ b.items }}" as="s" hint-placeholder-count="4"><div data-reveal="" style="display:flex; flex-direction:column; gap:10px; padding-top:18px; border-top:2px solid var(--acc)"><span style="font-family:'Montserrat',sans-serif; font-size:13px; color:var(--acc)">{{ s.k }}</span><span style="font-size:17px; line-height:1.45">{{ s.v }}</span></div></sc-for></div></section></sc-if>
