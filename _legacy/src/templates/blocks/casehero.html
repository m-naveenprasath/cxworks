<sc-if value="{{ b.is_casehero }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(130px,15vw,190px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto"><nav aria-label="Breadcrumb" style="margin:0 0 28px; display:flex; flex-wrap:wrap; gap:6px; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)"><a href="#/" style="color:var(--muted)" style-hover="color:var(--acc)">Home</a><span>/</span><a href="#/case-studies" style="color:var(--muted)" style-hover="color:var(--acc)">Case studies</a><span>/</span><span style="color:var(--acc)">{{ b.c.client }}</span></nav><div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px"><span style="display:inline-flex; align-items:center; min-height:34px; padding:0 14px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.16); font-size:13.5px; color:var(--ink3); color:var(--ink)">{{ b.c.client }}</span><span style="display:inline-flex; align-items:center; min-height:34px; padding:0 14px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.16); font-size:13.5px; color:var(--ink3)">{{ b.c.ind }}</span><span style="display:inline-flex; align-items:center; min-height:34px; padding:0 14px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.16); font-size:13.5px; color:var(--ink3)">{{ b.c.door }}</span><span style="display:inline-flex; align-items:center; min-height:34px; padding:0 14px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.16); font-size:13.5px; color:var(--ink3); border-color:rgba(var(--acc-rgb),.5); color:var(--acc)">Illustrative story</span></div><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap:clamp(28px,4vw,64px); align-items:end"><h1 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(38px,5.4vw,80px); letter-spacing:-0.045em; line-height:1.02; text-wrap:balance">{{ b.c.t }}</h1><div style="display:grid; grid-template-columns:1fr 1fr; gap:16px"><div style="padding:22px; background:rgba(var(--acc-rgb),.10); border:1px solid rgba(var(--acc-rgb),.55); border-radius:22px; display:flex; flex-direction:column; gap:6px"><span style="font-family:'Montserrat',sans-serif; font-weight:600; font-size:clamp(40px,4.4vw,60px); letter-spacing:-0.05em; line-height:1; color:var(--acc)">{{ b.c.n1v }}</span><span style="font-size:14.5px">{{ b.c.n1t }}</span></div><div style="padding:22px; background:linear-gradient(140deg, rgba(var(--glass),.075), rgba(var(--glass),.02) 50%, rgba(var(--glass),.04)); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid rgba(var(--glass),.12); box-shadow:inset 0 1px 0 rgba(var(--glass),.16); border-radius:22px; display:flex; flex-direction:column; gap:6px"><span style="font-family:'Montserrat',sans-serif; font-weight:600; font-size:clamp(40px,4.4vw,60px); letter-spacing:-0.05em; line-height:1">{{ b.c.n2v }}</span><span style="font-size:14.5px">{{ b.c.n2t }}</span></div></div></div></section></sc-if>
