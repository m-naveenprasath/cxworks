<sc-if value="{{ b.is_text }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); margin-bottom:16px">{{ b.eb }}</p><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance; font-size:clamp(26px,3vw,42px); max-width:30ch">{{ b.h }}</h2><p style="margin:0; font-size:clamp(16px,1.3vw,18px); line-height:1.6; color:var(--ink3); max-width:62ch; text-wrap:pretty; margin-top:16px">{{ b.p }}</p></section></sc-if>
