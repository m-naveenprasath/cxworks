<sc-if value="{{ b.is_split }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); margin-bottom:24px">{{ b.eb }}</p><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap:16px"><div data-reveal="" style="background:rgba(var(--acc-rgb),.10); border:1px solid rgba(var(--acc-rgb),.55); border-radius:22px; padding:clamp(22px,2.6vw,32px); display:flex; flex-direction:column; gap:12px"><span style="display:inline-flex; align-items:center; gap:10px; font-family:'Montserrat',sans-serif; font-weight:600; font-size:17px"><span aria-hidden="true" style="width:10px; height:10px; border-radius:50%; background:var(--acc); animation:cxPulse 1.6s ease-in-out infinite"></span>AI agents</span><p style="margin:0; font-size:17px; line-height:1.55">{{ b.ai }}</p></div><div data-reveal="" style="background:linear-gradient(140deg, rgba(var(--glass),.075), rgba(var(--glass),.02) 50%, rgba(var(--glass),.04)); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid rgba(var(--glass),.12); box-shadow:inset 0 1px 0 rgba(var(--glass),.16); border-radius:22px; padding:clamp(22px,2.6vw,32px); display:flex; flex-direction:column; gap:12px"><span style="font-family:'Montserrat',sans-serif; font-weight:600; font-size:17px">Experts</span><p style="margin:0; font-size:17px; line-height:1.55">{{ b.hu }}</p></div></div></section></sc-if>
