<sc-if value="{{ b.is_svcmap }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></sc-if></div>
<sc-if value="{{ b.wide }}" hint-placeholder-val="{{ true }}"><div data-reveal="" style="border:1px solid rgba(var(--ink-rgb),.12); border-radius:22px; overflow:hidden; background:rgba(var(--glass),.03)"><div style="display:grid; grid-template-columns:1.3fr 1fr 1fr 1fr 1fr; background:rgba(var(--ink-rgb),.05)"><span style="padding:16px 20px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3)">Service</span><sc-for list="{{ b.heads }}" as="hd" hint-placeholder-count="4"><span sc-camel-on-mouse-enter="{{ hd.enter }}" sc-camel-on-mouse-leave="{{ hd.leave }}" style="padding:16px 20px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:{{ hd.c }}; background:{{ hd.bg }}; transition:all .3s ease; cursor:default">{{ hd.t }}</span></sc-for></div>
<sc-for list="{{ b.rows }}" as="r" hint-placeholder-count="8"><a href="{{ r.href }}" sc-camel-on-mouse-enter="{{ r.enter }}" sc-camel-on-mouse-leave="{{ r.leave }}" style="display:grid; grid-template-columns:1.3fr 1fr 1fr 1fr 1fr; border-top:1px solid rgba(var(--ink-rgb),.08); background:{{ r.bg }}; text-decoration:none; color:var(--ink); transition:background .3s ease"><span style="padding:16px 20px; font-weight:600; font-size:15px; display:flex; gap:8px; align-items:baseline; color:{{ r.nc }}">{{ r.name }}<span aria-hidden="true" style="color:var(--acc); opacity:{{ r.arrow }}; transition:opacity .3s">→</span></span><sc-for list="{{ r.cells }}" as="ce" hint-placeholder-count="4"><span style="padding:16px 20px; font-size:14.5px; line-height:1.45; color:{{ ce.c }}; background:{{ ce.bg }}; transition:all .3s ease">{{ ce.t }}</span></sc-for></a></sc-for></div></sc-if>
<sc-if value="{{ b.narrow }}" hint-placeholder-val="{{ false }}"><div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:8px"><sc-for list="{{ b.heads }}" as="hd" hint-placeholder-count="4"><button type="button" sc-camel-on-click="{{ hd.tap }}" style="flex:none; min-height:44px; padding:0 16px; border-radius:999px; border:1px solid {{ hd.bd }}; background:{{ hd.bg }}; color:{{ hd.c }}; font:inherit; font-size:14px">{{ hd.t }}</button></sc-for></div><div style="display:flex; flex-direction:column; gap:10px"><sc-for list="{{ b.rows }}" as="r" hint-placeholder-count="8"><a href="{{ r.href }}" style="display:flex; flex-direction:column; gap:6px; padding:16px 18px; border-radius:16px; border:1px solid {{ r.bd }}; background:{{ r.bg }}; text-decoration:none; color:var(--ink)"><span style="font-weight:600; font-size:15.5px">{{ r.name }} <span style="color:var(--acc)">→</span></span><span style="font-size:14.5px; line-height:1.45; color:var(--ink3)"><span style="color:var(--acc)">{{ b.mobLabel }}:</span> {{ r.mob }}</span></a></sc-for></div></sc-if>
</section></sc-if>
