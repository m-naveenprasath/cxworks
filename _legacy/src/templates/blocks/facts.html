<sc-if value="{{ b.is_facts }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); margin-bottom:24px">{{ b.eb }}</p><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap:16px"><sc-for list="{{ b.items }}" as="f" hint-placeholder-count="3"><div data-reveal="" style="position:relative; overflow:hidden; border-radius:22px; padding:0; isolation:isolate; background:rgba(var(--acc-rgb),.10); border:1px solid rgba(var(--acc-rgb),.55); transition:transform .45s cubic-bezier(.16,1,.3,1), border-color .35s, box-shadow .45s, background .35s, opacity .9s cubic-bezier(.16,1,.3,1); transition-delay:{{ f.dl }}" style-hover="transform:translateY(-4px); border-color:var(--acc); background:rgba(var(--acc-rgb),.14); box-shadow:0 24px 50px -28px rgba(var(--acc-rgb),.7)"><div style="position:relative; height:100%; box-sizing:border-box; border-radius:21px; padding:clamp(22px,2.4vw,30px); display:flex; flex-direction:column; gap:14px"><span style="display:flex; align-items:center; justify-content:space-between; gap:10px"><span style="font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ f.n }} · {{ f.k }}</span><span aria-hidden="true" style="width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:rgba(var(--acc-rgb),.14); color:var(--acc)"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ f.ic }}"></path></svg></span></span><span style="white-space:pre-line; overflow-wrap:anywhere; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(19px,1.6vw,23px); line-height:1.3; color:var(--ink); text-wrap:pretty">{{ f.v }}</span></div></div></sc-for></div></section></sc-if>
