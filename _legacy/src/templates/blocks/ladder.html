<sc-if value="{{ b.is_ladder }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></sc-if><sc-if value="{{ b.hasP }}" hint-placeholder-val="{{ false }}"><p style="margin:0; font-size:clamp(16px,1.3vw,18px); line-height:1.6; color:var(--ink3); max-width:62ch; text-wrap:pretty">{{ b.p }}</p></sc-if></div><div data-mrail="" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap:16px"><sc-for list="{{ b.items }}" as="s" hint-placeholder-count="4"><a href="{{ s.href }}" data-reveal="" style="padding:clamp(20px,2.2vw,28px); border-radius:22px; border:1px solid {{ s.bd }}; background:{{ s.bg }}; display:flex; flex-direction:column; gap:12px; color:var(--ink); transition:transform .4s cubic-bezier(.16,1,.3,1)" style-hover="transform:translateY(-4px); color:var(--ink)"><span style="display:flex; justify-content:space-between; align-items:center; gap:8px"><span style="font-family:'Montserrat',sans-serif; font-size:13px; color:var(--acc)">Step {{ s.n }}</span><sc-if value="{{ s.hi }}" hint-placeholder-val="{{ false }}"><span style="padding:4px 10px; border-radius:999px; background:var(--acc); color:var(--on-acc); font-family:'Montserrat',sans-serif; font-size:11.5px; font-weight:600">Most complete</span></sc-if></span><span style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(19px,1.6vw,23px); letter-spacing:-0.02em; line-height:1.25">{{ s.t }}</span><span style="margin:0; font-size:15.5px; line-height:1.55; color:var(--muted); text-wrap:pretty; font-size:14.5px">{{ s.d }}</span><span style="margin-top:auto; padding-top:12px; border-top:1px solid rgba(var(--ink-rgb),.1); display:flex; justify-content:space-between; gap:8px; font-size:13.5px; color:var(--ink3)"><span>{{ s.time }}</span><span style="color:var(--acc)">{{ s.price }}</span></span></a></sc-for></div><sc-if value="{{ b.link }}" hint-placeholder-val="{{ false }}"><a href="{{ b.link.href }}" style="display:inline-flex; align-items:center; gap:8px; min-height:44px; font-family:'Montserrat',sans-serif; font-size:15px; font-weight:500; color:var(--acc); margin-top:24px" style-hover="color:var(--acc2); text-decoration:underline">{{ b.link.l }} <span aria-hidden="true">→</span></a></sc-if></section></sc-if>
