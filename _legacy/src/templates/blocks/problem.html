<sc-if value="{{ b.is_problem }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); margin-bottom:16px">{{ b.eb }}</p><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance; max-width:24ch">{{ b.a }} <span style="color:var(--acc); font-style:italic; font-weight:400">{{ b.b }}</span></h2><div style="margin-top:clamp(28px,3.4vw,48px); display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap:16px"><sc-for list="{{ b.lines }}" as="l" hint-placeholder-count="3"><div data-reveal="" style="padding:24px; border-radius:20px; border:1px solid rgba(var(--ink-rgb),.12); display:flex; flex-direction:column; gap:12px"><span style="font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ l.k }}</span><span style="font-size:17px; line-height:1.5; color:var(--ink)">{{ l.v }}</span></div></sc-for></div></section></sc-if>
