<sc-if value="{{ b.is_tools }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); margin-bottom:20px">{{ b.eb }}</p><div style="display:flex; flex-wrap:wrap; gap:8px"><sc-for list="{{ b.tools }}" as="t" hint-placeholder-count="5"><span style="display:inline-flex; align-items:center; gap:10px; min-height:48px; padding:0 18px 0 8px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.14); background:rgba(var(--ink-rgb),.03); font-size:15px; color:var(--ink2); white-space:nowrap; transition:border-color .3s, background .3s" style-hover="border-color:rgba(var(--acc-rgb),.5); background:rgba(var(--acc-rgb),.06)"><span aria-hidden="true" style="flex:0 0 32px; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#FFFFFF"><sc-if value="{{ t.hasImg }}" hint-placeholder-val="{{ false }}"><img src="{{ t.img }}" alt="" style="display:block; width:20px; height:20px; object-fit:contain; border-radius:4px"></sc-if><sc-if value="{{ t.hasIc }}" hint-placeholder-val="{{ false }}"><svg sc-camel-view-box="0 0 24 24" width="17" height="17" style="display:block"><path d="{{ t.d }}" fill="{{ t.c }}"></path></svg></sc-if><sc-if value="{{ t.noIc }}" hint-placeholder-val="{{ true }}"><span style="font-family:'Montserrat',sans-serif; font-weight:700; font-size:13px; color:#1C1C1E">{{ t.m }}</span></sc-if></span>{{ t.name }}</span></sc-for></div></section></sc-if>
