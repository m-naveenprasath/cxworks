<sc-if value="{{ b.is_gatechips }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); margin-bottom:20px">{{ b.eb }}</p><div style="display:flex; flex-wrap:wrap; gap:8px"><sc-for list="{{ b.chips }}" as="g" hint-placeholder-count="9"><a href="#/nine-gates" style="display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 18px; border-radius:999px; border:1px solid {{ g.bd }}; background:{{ g.bg }}; color:{{ g.c }}; font-size:14.5px; font-weight:{{ g.fw }}; box-shadow:{{ g.sh }}; transition:transform .3s cubic-bezier(.16,1,.3,1), filter .3s" style-hover="transform:translateY(-2px); filter:brightness(1.08)"><span style="font-family:'Montserrat',sans-serif; font-size:12px; opacity:.8">{{ g.n }}</span>{{ g.name }}<span aria-hidden="true" style="display:{{ g.arr }}">→</span></a></sc-for></div></section></sc-if>
