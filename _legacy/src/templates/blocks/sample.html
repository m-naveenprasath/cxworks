<sc-if value="{{ b.is_sample }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></sc-if><sc-if value="{{ b.hasP }}" hint-placeholder-val="{{ false }}"><p style="margin:0; font-size:clamp(16px,1.3vw,18px); line-height:1.6; color:var(--ink3); max-width:62ch; text-wrap:pretty">{{ b.p }}</p></sc-if></div><div data-reveal="" role="img" aria-label="Sample report: Nine Gate score 58 out of 100, earliest failing gate Findability" style="background:linear-gradient(140deg, rgba(var(--glass),.075), rgba(var(--glass),.02) 50%, rgba(var(--glass),.04)); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid rgba(var(--glass),.12); box-shadow:inset 0 1px 0 rgba(var(--glass),.16); border-radius:22px; padding:clamp(20px,3vw,36px); display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap:clamp(20px,3vw,40px); max-width:1100px"><div style="display:flex; flex-direction:column; gap:14px"><span style="font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)">Sample · {{ b.name }}</span><span style="display:flex; align-items:baseline; gap:8px"><span style="font-family:'Montserrat',sans-serif; font-weight:600; font-size:clamp(56px,6vw,84px); letter-spacing:-0.05em; line-height:1; color:var(--acc)">58</span><span style="font-size:18px; color:var(--muted)">/ 100 Nine Gate score</span></span><div style="padding:14px; background:rgba(var(--acc-rgb),.10); border:1px solid rgba(var(--acc-rgb),.55); border-radius:22px; border-radius:14px; display:flex; flex-direction:column; gap:4px"><span style="font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--acc)">Earliest failing gate</span><span style="font-size:16px">Findability: 1 in 6 searches return no results.</span></div><span style="font-size:14px; color:var(--muted)">Expert note: fix part-number search before running more checkout tests.</span></div><div style="display:flex; flex-direction:column; gap:10px"><sc-for list="{{ sampleBars }}" as="g" hint-placeholder-count="9"><div style="display:grid; grid-template-columns:110px minmax(0,1fr) 36px; gap:10px; align-items:center; font-size:13.5px"><span style="color:var(--ink3)">{{ g.name }}</span><span style="height:8px; border-radius:999px; background:rgba(var(--ink-rgb),.08); overflow:hidden"><span style="display:block; height:100%; width:{{ g.w }}; background:{{ g.c }}; border-radius:999px"></span></span><span style="text-align:right; color:{{ g.c }}">{{ g.v }}</span></div></sc-for></div></div></section></sc-if>
