<sc-if value="{{ b.is_gatesall }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto"><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></div><div style="display:flex; flex-direction:column; gap:clamp(36px,4vw,56px)"><sc-for list="{{ gatesAll }}" as="st" hint-placeholder-count="3"><div style="display:flex; flex-direction:column; gap:16px"><div style="display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 16px; padding-bottom:12px; border-bottom:1px solid rgba(var(--ink-rgb),.1)"><span style="font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(24px,2.4vw,32px); letter-spacing:-0.03em; color:var(--acc)">{{ st.stage }}.</span><span style="font-size:16px; color:var(--muted)">{{ st.tag }}</span></div><div data-mrail="" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap:16px"><sc-for list="{{ st.gates }}" as="g" hint-placeholder-count="3"><div data-reveal="" style="background:linear-gradient(140deg, rgba(var(--glass),.075), rgba(var(--glass),.02) 50%, rgba(var(--glass),.04)); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid rgba(var(--glass),.12); box-shadow:inset 0 1px 0 rgba(var(--glass),.16); border-radius:22px; padding:clamp(20px,2.2vw,28px); display:flex; flex-direction:column; gap:14px; transition:border-color .4s, transform .4s cubic-bezier(.16,1,.3,1), opacity .9s cubic-bezier(.16,1,.3,1)" style-hover="border-color:rgba(var(--acc-rgb),.55); transform:translateY(-4px)"><div style="display:flex; flex-direction:column; gap:6px"><span style="font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; color:var(--acc)">GATE {{ g.n }}</span><span style="font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(20px,1.8vw,24px); letter-spacing:-0.02em">{{ g.name }}</span><span style="font-size:15px; line-height:1.55; color:var(--ink3); text-wrap:pretty">{{ g.d }}</span></div><div style="display:flex; flex-direction:column; gap:10px; padding-top:14px; border-top:1px solid rgba(var(--ink-rgb),.1)"><div style="display:flex; flex-direction:column; gap:3px"><span style="font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted2)">I sell online</span><span style="font-size:14px; line-height:1.5; color:var(--ink)">{{ g.sell }}</span></div><div style="display:flex; flex-direction:column; gap:3px"><span style="font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted2)">I get enquiries online</span><span style="font-size:14px; line-height:1.5; color:var(--ink)">{{ g.enq }}</span></div></div></div></sc-for></div></div></sc-for></div></section></sc-if>
