<sc-if value="{{ b.is_gates }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div aria-hidden="true" style="position:absolute; right:clamp(20px,5vw,64px); top:clamp(40px,5vw,72px); display:grid; grid-template-columns:repeat(3,14px); gap:6px; opacity:.5; pointer-events:none"><span style="height:14px; border:1px solid rgba(var(--acc-rgb),.5); border-radius:3px"></span><span style="height:14px; border:1px solid rgba(var(--acc-rgb),.5); border-radius:3px"></span><span style="height:14px; border:1px solid rgba(var(--acc-rgb),.5); border-radius:3px"></span><span style="height:14px; border:1px solid rgba(var(--acc-rgb),.5); border-radius:3px"></span><span style="height:14px; background:var(--acc); border-radius:3px"></span><span style="height:14px; border:1px solid rgba(var(--acc-rgb),.5); border-radius:3px"></span><span style="height:14px; border:1px solid rgba(var(--acc-rgb),.5); border-radius:3px"></span><span style="height:14px; border:1px solid rgba(var(--acc-rgb),.5); border-radius:3px"></span><span style="height:14px; border:1px solid rgba(var(--acc-rgb),.5); border-radius:3px"></span></div><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></sc-if><sc-if value="{{ b.hasP }}" hint-placeholder-val="{{ false }}"><p style="margin:0; font-size:clamp(16px,1.3vw,18px); line-height:1.6; color:var(--ink3); max-width:62ch; text-wrap:pretty">{{ b.p }}</p></sc-if></div><div data-mrail="" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap:16px"><sc-for list="{{ gateCols }}" as="gc" hint-placeholder-count="3"><div data-reveal="" style="background:linear-gradient(140deg, rgba(var(--glass),.075), rgba(var(--glass),.02) 50%, rgba(var(--glass),.04)); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid rgba(var(--glass),.12); box-shadow:inset 0 1px 0 rgba(var(--glass),.16); border-radius:22px; padding:clamp(22px,2.4vw,30px); display:flex; flex-direction:column; gap:18px"><div style="display:flex; flex-direction:column; gap:6px"><span style="font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(30px,3vw,40px); letter-spacing:-0.04em; color:var(--acc); font-style:italic">{{ gc.stage }}</span><span style="font-size:15px; color:var(--muted)">{{ gc.tag }}</span></div><div style="display:flex; flex-direction:column"><sc-for list="{{ gc.gates }}" as="g" hint-placeholder-count="3"><div style="display:grid; grid-template-columns:34px minmax(0,1fr); gap:10px; padding:14px 0; border-top:1px solid rgba(var(--ink-rgb),.1)"><span style="font-family:'Montserrat',sans-serif; font-size:12.5px; color:var(--acc); padding-top:3px">{{ g.n }}</span><span style="display:flex; flex-direction:column; gap:4px"><span style="font-family:'Montserrat',sans-serif; font-weight:500; font-size:17px">{{ g.name }}</span><span style="font-size:14.5px; line-height:1.5; color:var(--muted)">{{ g.d }}</span></span></div></sc-for></div></div></sc-for></div><sc-if value="{{ b.link }}" hint-placeholder-val="{{ false }}"><a href="{{ b.link.href }}" style="display:inline-flex; align-items:center; gap:8px; min-height:44px; font-family:'Montserrat',sans-serif; font-size:15px; font-weight:500; color:var(--acc); margin-top:24px" style-hover="color:var(--acc2); text-decoration:underline">{{ b.link.l }} <span aria-hidden="true">→</span></a></sc-if></section></sc-if>
