<sc-if value="{{ b.is_casehub }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative; padding-top:40px"><div style="display:flex; flex-direction:column; gap:12px; margin-bottom:28px"><sc-for list="{{ caseFilters }}" as="fg" hint-placeholder-count="3"><div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center"><span style="font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); min-width:70px">{{ fg.k }}</span><sc-for list="{{ fg.opts }}" as="o" hint-placeholder-count="4"><button sc-camel-on-click="{{ o.pick }}" aria-pressed="{{ o.on }}" style="min-height:44px; padding:0 16px; border-radius:999px; border:1px solid {{ o.border }}; background:{{ o.bg }}; color:{{ o.c }}; font-family:inherit; font-size:14px; cursor:pointer">{{ o.l }}</button></sc-for></div></sc-for></div><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap:16px"><sc-for list="{{ caseList }}" as="cs" hint-placeholder-count="3"><div style="background:linear-gradient(140deg, rgba(var(--glass),.075), rgba(var(--glass),.02) 50%, rgba(var(--glass),.04)); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid rgba(var(--glass),.12); box-shadow:inset 0 1px 0 rgba(var(--glass),.16); border-radius:22px; padding:clamp(22px,2.4vw,30px); display:flex; flex-direction:column; gap:16px; color:var(--ink); transition:border-color .4s, transform .4s cubic-bezier(.16,1,.3,1)"><span style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between"><span style="font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">Failing gate: {{ cs.gate }}</span><span style="font-size:12px; color:var(--muted2)">Illustrative</span></span><span style="display:grid; grid-template-columns:1fr 1fr; gap:12px"><span style="display:flex; flex-direction:column; gap:4px"><span style="font-family:'Montserrat',sans-serif; font-weight:600; font-size:clamp(30px,3vw,40px); letter-spacing:-0.04em; color:var(--acc)">{{ cs.n1v }}</span><span style="font-size:13.5px; color:var(--muted)">{{ cs.n1t }}</span></span><span style="display:flex; flex-direction:column; gap:4px"><span style="font-family:'Montserrat',sans-serif; font-weight:600; font-size:clamp(30px,3vw,40px); letter-spacing:-0.04em; color:var(--acc)">{{ cs.n2v }}</span><span style="font-size:13.5px; color:var(--muted)">{{ cs.n2t }}</span></span></span><span style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(19px,1.6vw,23px); letter-spacing:-0.02em; line-height:1.25">{{ cs.t }}</span><span style="margin-top:auto; font-size:13.5px; color:var(--muted)">{{ cs.client }} · {{ cs.door }}</span></div></sc-for></div><sc-if value="{{ caseNone }}" hint-placeholder-val="{{ false }}"><p style="margin:0; font-size:15.5px; line-height:1.55; color:var(--muted); text-wrap:pretty">No stories match yet. Try another filter.</p></sc-if></section></sc-if>
