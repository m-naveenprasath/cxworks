<sc-if value="{{ b.is_doors }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></sc-if><sc-if value="{{ b.hasP }}" hint-placeholder-val="{{ false }}"><p style="margin:0; font-size:clamp(16px,1.3vw,18px); line-height:1.6; color:var(--ink3); max-width:62ch; text-wrap:pretty">{{ b.p }}</p></sc-if></div><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap:16px"><sc-for list="{{ b.doors }}" as="d" hint-placeholder-count="2"><div data-reveal="" sc-camel-on-mouse-enter="{{ d.enter }}" sc-camel-on-mouse-leave="{{ d.leave }}" style="background:{{ d.bgi }}; backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid {{ d.bd }}; box-shadow:{{ d.sh }}; transform:{{ d.tf }}; transition:transform .45s cubic-bezier(.16,1,.3,1), box-shadow .45s ease, border-color .35s ease, background .45s ease; border-radius:22px; padding:clamp(22px,2.6vw,32px); display:flex; flex-direction:column; gap:16px"><span style="font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(24px,2.2vw,30px); letter-spacing:-0.03em; color:{{ d.tc }}; transition:color .35s ease">{{ d.t }}</span><div style="display:flex; flex-wrap:wrap; gap:8px"><sc-for list="{{ d.pts }}" as="p" hint-placeholder-count="4"><span style="display:inline-flex; align-items:center; mi
