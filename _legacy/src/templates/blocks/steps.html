<sc-if value="{{ b.is_steps }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></sc-if><sc-if value="{{ b.hasP }}" hint-placeholder-val="{{ false }}"><p style="margin:0; font-size:clamp(16px,1.3vw,18px); line-height:1.6; color:var(--ink3); max-width:62ch; text-wrap:pretty">{{ b.p }}</p></sc-if></div><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap:16px"><sc-for list="{{ b.items }}" as="s" hint-placeholder-count="3"><div data-reveal="" style="padding:clamp(20px,2.2vw,28px); border-radius:22px; border:1px solid rgba(var(--ink-rgb),.12); display:flex; flex-direction:column; gap:10px"><span style="width:40px; height:40px; border-radius:50%; border:1px solid var(--acc); display:grid; place-items:center; font-family:'Montserrat',sans-serif; font-size:14px; color:var(--acc)">{{ s.n }}</span><span style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(19px,1.6vw,23px); letter-spacing:-0.02em; line-height:1.25">{{ s.k }}</span><span style="margin:0; font-size:15.5px; line-height:1.55; color:var(--muted); text-wrap:pretty">{{ s.v }}</span></div></sc-for></div></section></sc-if>
