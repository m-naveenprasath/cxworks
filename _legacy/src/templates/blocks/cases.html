<sc-if value="{{ b.is_cases }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto"><div style="display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 32px; margin-bottom:clamp(28px,3.4vw,44px)"><div style="display:flex; flex-direction:column; gap:14px"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">Results by solution</p><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(30px,4vw,54px); letter-spacing:-0.04em; line-height:1.05; text-wrap:balance">One number for every solution.</h2></div><p style="margin:0; max-width:34ch; font-size:14px; line-height:1.5; color:var(--muted)">Typical results from client work. Figures are illustrative.</p></div><div data-mrail="" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap:14px"><sc-for list="{{ solMetrics }}" as="m" hint-placeholder-count="8"><a href="{{ m.href }}" data-reveal="" style="background:linear-gradient(140deg, rgba(var(--glass),.075), rgba(var(--glass),.02) 50%, rgba(var(--glass),.04)); border:1px solid {{ m.bd }}; box-shadow:inset 0 1px 0 rgba(var(--glass),.14); border-radius:20px; padding:22px; display:flex; flex-direction:column; gap:18px; min-height:220px; box-sizing:border-box; color:var(--ink); transition:border-color .35s, transform .35s cubic-bezier(.16,1,.3,1), opacity .9s cubic-bezier(.16,1,.3,1)" style-hover="border-color:rgba(var(--acc-rgb),.55); transform:translateY(-3px); color:var(--ink)"><span style="align-self:flex-start; padding:5px 10px; border-radius:999px; background:rgba(var(--acc-rgb),.12); color:var(--acc); font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap">{{ m.gate }}</span><span style="display:flex; flex-direction:column; gap:6px"><span style="font-family:'Montserrat',sans-serif; font-weight:600; font-size:clamp(40px,3.6vw,52px); letter-spacing:-0.04em; line-height:1; color:var(--acc)">{{ m.v }}</span><span style="font-size:14.5px; line-height:1.45; color:var(--ink3); text-wrap:pretty">{{ m.k }}</span></span><span style="margin-top:auto; padding-top:14px; border-top:1px solid rgba(var(--ink-rgb),.1); display:flex; justify-content:space-between; align-items:center; gap:10px; font-family:'Montserrat',sans-serif; font-weight:500; font-size:14.5px; line-height:1.3">{{ m.name }}<span aria-hidden="true" style="flex:0 0 28px; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--acc); color:var(--on-acc); font-size:13px">→</span></span></a></sc-for></div></section></sc-if>
