<sc-if value="{{ b.is_table }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></sc-if><sc-if value="{{ b.hasP }}" hint-placeholder-val="{{ false }}"><p style="margin:0; font-size:clamp(16px,1.3vw,18px); line-height:1.6; color:var(--ink3); max-width:62ch; text-wrap:pretty">{{ b.p }}</p></sc-if></div><div style="overflow-x:auto; border-radius:20px; border:1px solid rgba(var(--ink-rgb),.12)"><sc-raw-table style="width:100%; min-width:620px; border-collapse:collapse; font-size:15px"><sc-raw-thead><sc-raw-tr><sc-for list="{{ b.cols }}" as="c" hint-placeholder-count="4"><sc-raw-th scope="col" style="text-align:left; padding:16px 18px; font-family:'Montserrat',sans-serif; font-size:13px; font-weight:600; color:var(--acc); background:rgba(var(--acc-rgb),.08); border-bottom:1px solid rgba(var(--ink-rgb),.12)">{{ c }}</sc-raw-th></sc-for></sc-raw-tr></sc-raw-thead><sc-raw-tbody><sc-for list="{{ b.rows }}" as="r" hint-placeholder-count="4"><sc-raw-tr><sc-for list="{{ r }}" as="v" hint-placeholder-count="4"><sc-raw-td style="padding:14px 18px; border-bottom:1px solid rgba(var(--ink-rgb),.08); color:var(--ink3); vertical-align:top">{{ v }}</sc-raw-td></sc-for></sc-raw-tr></sc-for></sc-raw-tbody></sc-raw-table></div></section></sc-if>
