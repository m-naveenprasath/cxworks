<sc-if value="{{ b.is_related }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); margin-bottom:24px">{{ b.eb }}</p><div data-mrail="" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap:16px"><sc-for list="{{ b.items }}" as="r" hint-placeholder-count="4"><a href="{{ r.href }}" data-reveal="" style="display:flex; flex-direction:column; gap:12px; min-height:250px; box-sizing:border-box; padding:clamp(22px,2.4vw,30px); border-radius:22px; color:var(--ink); border:1px solid rgba(var(--ink-rgb),.12); background:var(--surface); transition:transform .4s cubic-bezier(.16,1,.3,1), border-color .4s, background .4s, opacity .9s cubic-bezier(.16,1,.3,1)" style-hover="transform:translateY(-3px); border-color:rgba(var(--acc-rgb),.6); background:rgba(var(--acc-rgb),.06); color:var(--ink)"><span style="display:flex; align-items:center; justify-content:space-between; gap:10px"><span style="font-family:'Montserrat',sans-serif; font-size:13px; color:var(--acc)">{{ r.tag }} {{ r.n }}</span><span aria-hidden="true" style="width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:rgba(var(--acc-rgb),.14); color:var(--acc)"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ r.ic }}"></path></svg></span></span><span style="font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(20px,1.7vw,24px); line-height:1.2; letter-spacing:-0.02em; text-wrap:balance">{{ r.l }}</span><sc-if value="{{ r.hasD }}" hint-placeholder-val="{{ true }}"><span style="font-size:15px; line-height:1.55; color:var(--muted); text-wrap:pretty">{{ r.d }}</span></sc-if><span style="margin-top:auto; padding-top:16px; border-top:1px solid rgba(var(--ink-rgb),.1); display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:14px"><span style="color:var(--ink3)">{{ r.gates }}</span><span style="display:inline-flex; align-items:center; gap:6px; color:var(--acc); white-space:nowrap">View<span aria-hidden="true">→</span></span></span></a></sc-for></div><sc-if value="{{ b.hasHubs }}" hint-placeholder-val="{{ false }}"><div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:24px"><span style="font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-right:6px">Also explore</span><sc-for list="{{ b.hubs }}" as="hb" hint-placeholder-count="4"><a href="{{ hb.href }}" style="display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 16px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.16); background:rgba(var(--glass),.03); font-size:14px; color:var(--ink); transition:border-color .25s, background .25s" style-hover="border-color:var(--acc); background:rgba(var(--acc-rgb),.1); color:var(--ink)">{{ hb.l }}<span aria-hidden="true" style="color:var(--acc)">→</span></a></sc-for></div></sc-if><sc-if value="{{ b.hasSvcs }}" hint-placeholder-val="{{ false }}"><div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:14px"><sc-for list="{{ b.svcList }}" as="sv" hint-placeholder-count="8"><a href="{{ sv.href }}" style="display:inline-flex; align-items:center; min-height:40px; padding:0 16px; border-radius:999px; border:1px solid rgba(var(--acc-rgb),.3); background:rgba(var(--acc-rgb),.06); font-size:14px; color:var(--ink); transition:border-color .25s, background .25s" style-hover="border-color:var(--acc); background:rgba(var(--acc-rgb),.14); color:var(--ink)">{{ sv.l }}</a></sc-for></div></sc-if></section></sc-if>
