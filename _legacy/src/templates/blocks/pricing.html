<div style="display:flex; flex-direction:column; border-top:1px solid rgba(var(--ink-rgb),.1)"><sc-for list="{{ p.inc }}" as="i" hint-placeholder-count="4"><span style="display:flex; gap:10px; padding:10px 0; border-bottom:1px solid rgba(var(--ink-rgb),.08); font-size:15px"><span aria-hidden="true" style="color:var(--acc); flex:none; display:inline-flex; padding-top:.25em"><svg width="13" height="13" sc-camel-view-box="0 0 24 24" fill="currentColor" style="display:block"><path d="M12 2.5c.7 4.6 3.4 7.3 8 8-4.6.7-7.3 3.4-8 8-.7-4.6-3.4-7.3-8-8 4.6-.7 7.3-3.4 8-8z"></path></svg></span>{{ i }}</span></sc-for></div><a href="#/contact-us?topic=Run%20pod" style="display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:0 24px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.32); color:var(--ink); font-family:'Montserrat',sans-serif; font-weight:500; font-size:15px; line-height:1.2; text-align:center; background:transparent; cursor:pointer; transition:border-color .3s, background .3s; margin-top:auto" style-hover="border-color:var(--acc); background:rgba(var(--acc-rgb),.08); color:var(--ink)">Talk to us</a></div></sc-for></div></section></sc-if>
