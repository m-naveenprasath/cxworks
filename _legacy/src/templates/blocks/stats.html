<sc-if value="{{ b.is_stats }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" data-proof="" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative; padding-top:clamp(48px,6vw,80px)"><div data-m2="" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap:16px"><sc-for list="{{ statsC }}" as="st" hint-placeholder-count="3"><div data-reveal="" style="position:relative; overflow:hidden; background:rgba(var(--acc-rgb),.10); border:1px solid rgba(var(--acc-rgb),.55); border-radius:22px; padding:0; isolation:isolate; transition:transform .45s cubic-bezier(.16,1,.3,1), border-color .35s, box-shadow .45s, background .35s, opacity .9s cubic-bezier(.16,1,.3,1); transition-delay:{{ st.dl }}" style-hover="transform:translateY(-4px); border-color:var(--acc); background:rgba(var(--acc-rgb),.14); box-shadow:0 24px 50px -28px rgba(var(--acc-rgb),.7)"><div style="position:relative; height:100%; border-radius:21px; padding:clamp(22px,2.4vw,30px); display:flex; flex-direction:column; gap:6px"><span style="font-family:'Montserrat',sans-serif; font-weight:600; font-size:clamp(44px,5vw,72px); letter-spacing:-0.05em; line-height:1; color:var(--acc)">{{ st.v }}</span><span style="font-family:'Montserrat',sans-serif; font-size:16px; font-weight:500">{{ st.t }}</span><span style="margin:0; font-size:14px; line-height:1.55; color:var(--muted)">{{ st.d }}</span></div></div></sc-for></div></section></sc-if>
