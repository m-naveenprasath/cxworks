<sc-if value="{{ b.is_stages }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div style="display:flex; flex-direction:column; gap:16px; margin-bottom:clamp(28px,3.4vw,48px)"><p style="margin:0; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)">{{ b.eb }}</p><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(32px,4.4vw,60px); letter-spacing:-0.04em; line-height:1.05; max-width:22ch; text-wrap:balance">{{ b.h }}</h2></sc-if><sc-if value="{{ b.hasP }}" hint-placeholder-val="{{ false }}"><p style="margin:0; font-size:clamp(16px,1.3vw,18px); line-height:1.6; color:var(--ink3); max-width:62ch; text-wrap:pretty">{{ b.p }}</p></sc-if></div><div data-mrail="" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap:16px"><sc-for list="{{ b.items }}" as="s" hint-placeholder-count="3"><div data-reveal="" style="background:linear-gradient(140deg, rgba(var(--glass),.075), rgba(var(--glass),.02) 50%, rgba(var(--glass),.04)); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid rgba(var(--glass),.12); box-shadow:inset 0 1px 0 rgba(var(--glass),.16); border-radius:22px; padding:clamp(22px,2.4vw,30px); display:flex; flex-direction:column; gap:16px"><span style="font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)">{{ s.n }} · {{ s.verb }}</span><h3 style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(19px,1.6vw,23px); letter-spacing:-0.02em; line-height:1.25; font-size:clamp(28px,2.6vw,36px); letter-spacing:-0.035em">{{ s.name }}</h3><p style="margin:0; font-size:15.5px; line-height:1.55; color:var(--muted); text-wrap:pretty">{{ s.line }}</p><div style="display:flex; flex-direction:column"><sc-for list="{{ s.links }}" as="l" hint-placeholder-count="5"><a href="{{ l.href }}" style="display:flex; justify-content:space-between; gap:10px; align-items:center; min-height:44px; border-top:1px solid rgba(var(--ink-rgb),.1); font-size:15px; color:var(--ink)" style-hover="color:var(--acc)">{{ l.l }}<span aria-hidden="true" style="color:var(--acc)">→</span></a></sc-for></div></div></sc-for></div><div data-reveal="" style="margin-top:16px; background:rgba(var(--acc-rgb),.10); border:1px solid rgba(var(--acc-rgb),.55); border-radius:22px; padding:clamp(18px,2.2vw,26px) clamp(20px,2.6vw,32px); display:flex; flex-wrap:wrap; gap:12px 28px; align-items:center; justify-content:space-between"><span style="display:inline-flex; align-items:center; gap:12px; font-family:'Montserrat',sans-serif; font-weight:600; font-size:17px"><span aria-hidden="true" style="width:10px; height:10px; border-radius:50%; background:var(--acc); animation:cxPulse 1.6s ease-in-out infinite"></span>AI agent layer</span><span style="font-size:15.5px; color:var(--ink); flex:1 1 320px">Runs across all three stages, watching all nine gates, every day. Experts decide before anything ships.</span></div></section></sc-if>
