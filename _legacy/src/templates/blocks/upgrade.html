<sc-if value="{{ b.is_upgrade }}" hint-placeholder-val="{{ false }}"><section data-screen-label="{{ b.label }}" style="padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px) 0; max-width:1440px; margin:0 auto; position:relative"><div data-reveal="" style="background:rgba(var(--acc-rgb),.10); border:1px solid rgba(var(--acc-rgb),.55); border-radius:22px; padding:clamp(22px,3vw,36px); display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:space-between"><div style="display:flex; flex-direction:column; gap:8px; flex:1 1 360px"><span style="margin:0; font-family:'Montserrat',sans-serif; font-weight:500; font-size:clamp(19px,1.6vw,23px); letter-spacing:-0.02em; line-height:1.25">{{ b.h }}</span><span style="margin:0; font-size:15.5px; line-height:1.55; color:var(--muted); text-wrap:pretty; color:var(--ink3)">{{ b.p }}</span></div><div style="display:flex; flex-wrap:wrap; gap:12px"><sc-if value="{{ b.btn1 }}" hint-placeholder-val="{{ true }}"><a href="{{ b.btn1.href }}" data-magnet="" style="display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:0 26px; border-radius:999px; background:var(--acc); color:var(--on-acc); font-family:'Montserrat',sans-serif; font-weight:600; font-size:15px; line-height:1.2; text-align:center; border:0; cursor:pointer; transition:background .3s, transform .3s" style-hover="background:var(--acc2); color:var(--on-acc); transform:translateY(-1px)">{{ b.btn1.l }} <span aria-hidden="true">→</span></a></sc-if><sc-if value="{{ b.btn2 }}" hint-placeholder-val="{{ false }}"><a href="{{ b.btn2.href }}" style="display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:0 24px; border-radius:999px; border:1px solid rgba(var(--ink-rgb),.32); color:var(--ink); font-family:'Montserrat',sans-serif; font-weight:500; font-size:15px; line-height:1.2; text-align:center; background:transparent; cursor:pointer; transition:border-color .3s, background .3s" style-hover="border-color:var(--acc); background:rgba(var(--acc-rgb),.08); color:var(--ink)">{{ b.btn2.l }}</a></sc-if></div></div></section></sc-if>
